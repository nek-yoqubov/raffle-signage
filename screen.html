<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Супер Розыгрыш — PROMEBEL</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root{
  --bg:      #f3efe8;
  --bg2:     #eae4d9;
  --panel:   #ffffff;
  --ink:     #1c1712;
  --ink-2:   #4a4238;
  --muted:   #948a79;
  --line:    #e2dacb;
  --orange:  #ef7d1a;
  --orange-d:#d9600a;
  --gold:    #caa24a;
  --dark:    #16130f;
  --shadow:  0 10px 30px rgba(40,28,10,0.10);
  --shadow-lg:0 30px 80px rgba(30,18,4,0.35);
}

html,body{
  width:100%; height:100%;
  background:var(--bg);
  font-family:'Manrope',sans-serif;
  color:var(--ink);
  overflow:hidden;
}

/* ============ LAYOUT ============ */
.screen{
  position:relative;
  width:100vw; height:100vh;
  display:flex; flex-direction:column;
  background:
    radial-gradient(120% 60% at 50% -10%, #fbf7f0 0%, var(--bg) 55%),
    var(--bg);
}

/* ============ HEADER (light, for transparent black logo) ============ */
.header{
  flex-shrink:0;
  background:var(--panel);
  padding:12px 26px 10px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:4px solid var(--orange);
  box-shadow:0 6px 18px rgba(40,28,10,.06);
}
.brand{ display:flex; align-items:center; gap:16px; }
.brand img{ height:44px; width:auto; display:block; }
.brand-fallback{
  display:flex; align-items:center; gap:12px;
  font-family:'Bebas Neue',sans-serif; letter-spacing:.06em;
}
.brand-hex{
  width:40px; height:44px; background:var(--orange);
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:1.5rem;
}
.brand-name{ color:var(--ink); font-size:2.1rem; line-height:1; }
.brand-name b{ color:var(--orange); font-weight:400; }

.live{
  display:flex; align-items:center; gap:9px;
  background:rgba(239,125,26,.1);
  border:1px solid rgba(239,125,26,.35);
  color:var(--orange-d);
  border-radius:100px; padding:8px 16px;
  font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; font-weight:700;
}
.live-dot{ width:8px; height:8px; border-radius:50%; background:var(--orange);
  animation:pulse 1.7s ease-in-out infinite; }
@keyframes pulse{
  0%,100%{ opacity:1; transform:scale(1); box-shadow:0 0 0 0 rgba(239,125,26,.5); }
  50%{ opacity:.55; transform:scale(1.35); box-shadow:0 0 0 6px rgba(239,125,26,0); }
}

/* ============ TITLE STRIP (secondary, small) ============ */
.title-strip{
  flex-shrink:0;
  padding:8px 26px 2px;
  display:flex; align-items:baseline; justify-content:space-between; gap:14px;
}
.title-strip .kicker{
  font-size:.62rem; letter-spacing:.2em; text-transform:uppercase;
  color:var(--orange-d); font-weight:700; text-align:right; flex-shrink:0;
}
.title-strip h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1.5rem,6.4vw,2.1rem); letter-spacing:.05em; line-height:1; color:var(--ink);
}
.title-strip h1 span{ color:var(--orange); }

/* ============ STATS ============ */
.stats{
  flex-shrink:0;
  margin:6px 26px 0;
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
}
.stat{
  background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:10px 16px; box-shadow:var(--shadow);
  display:flex; flex-direction:column;
}
.stat .n{
  font-family:'Bebas Neue',sans-serif; font-size:2rem; line-height:.9;
  color:var(--ink);
}
.stat.accent .n{ color:var(--orange-d); }
.stat .l{ font-size:.6rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted); margin-top:6px; font-weight:600; }

/* ============ CONDITIONS (typewriter) ============ */
.cond{
  flex-shrink:0;
  margin:8px 26px 0;
  background:linear-gradient(180deg,#fff,#fbf6ee);
  border:1px solid var(--line); border-left:4px solid var(--orange);
  border-radius:12px; padding:9px 16px;
  display:flex; flex-direction:column; justify-content:center;
  box-shadow:var(--shadow);
}
.cond .tag{ font-size:.56rem; letter-spacing:.2em; text-transform:uppercase;
  color:var(--muted); font-weight:700; margin-bottom:4px; }
.cond .type{
  font-size:1rem; font-weight:600; color:var(--ink-2); line-height:1.35;
  min-height:1.35em;
}
.cond .type b{ color:var(--orange-d); font-weight:800; }
.caret{
  display:inline-block; width:3px; height:1.05em; background:var(--orange);
  margin-left:3px; vertical-align:-2px; animation:blink .9s step-end infinite;
}
@keyframes blink{ 50%{ opacity:0; } }

/* ============ LIST ============ */
.list-head{
  flex-shrink:0; margin:10px 26px 6px;
  display:flex; align-items:center; gap:12px;
}
.list-head .t{ font-size:.66rem; letter-spacing:.18em; text-transform:uppercase;
  color:var(--muted); font-weight:700; }
.list-head .rule{ flex:1; height:1px; background:var(--line); }

/* list takes at least ~55% of the screen height */
.viewport{
  flex:1 1 auto; min-height:55vh; overflow:hidden; position:relative;
  margin:0 26px 8px;
}
.viewport::before, .viewport::after{
  content:''; position:absolute; left:0; right:0; height:40px; z-index:3; pointer-events:none;
}
.viewport::before{ top:0; background:linear-gradient(to bottom,var(--bg),transparent); }
.viewport::after{ bottom:0; background:linear-gradient(to top,var(--bg),transparent); }

.track{ display:flex; flex-direction:column; gap:10px;
  transition:transform .85s cubic-bezier(.4,0,.2,1); }

.row{
  background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:12px 16px;
  display:flex; align-items:center; gap:12px;
  box-shadow:0 4px 14px rgba(40,28,10,0.05);
  flex-shrink:0;
}
.row.r1{ border-color:rgba(202,162,74,.55); background:linear-gradient(180deg,#fffdf6,#fff); }
.row.r2{ border-color:rgba(150,150,160,.4); }
.row.r3{ border-color:rgba(200,130,90,.4); }

.rank{
  width:38px; height:38px; flex-shrink:0; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue',sans-serif; font-size:1.4rem;
  background:var(--bg2); color:var(--ink-2);
}
.r1 .rank{ background:linear-gradient(135deg,#f3d27a,#caa24a); color:#4a3608; }
.r2 .rank{ background:linear-gradient(135deg,#e6e6ea,#b9bcc4); color:#3a3d44; }
.r3 .rank{ background:linear-gradient(135deg,#f0c39c,#c98a5f); color:#4a2b13; }

.who{ flex:1 1 auto; min-width:0; }
.who .name{ font-size:1.1rem; font-weight:700; color:var(--ink); line-height:1.22;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

.bar-wrap{ width:48px; flex-shrink:0; }
.bar{ height:5px; background:var(--bg2); border-radius:3px; overflow:hidden; }
.bar > i{ display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--orange),var(--gold));
  border-radius:3px; transition:width 1.1s cubic-bezier(.4,0,.2,1); }

.coupons{
  flex-shrink:0; text-align:center; min-width:64px;
  background:linear-gradient(180deg,#fff4e6,#ffe9cf);
  border:1px solid rgba(239,125,26,.35);
  border-radius:12px; padding:6px 12px;
}
.coupons .cn{ font-family:'Bebas Neue',sans-serif; font-size:1.7rem;
  color:var(--orange-d); line-height:.9; }
.coupons .cl{ font-size:.52rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); font-weight:700; margin-top:2px; }

/* ============ NARROW PHONES (preview) ============ */
@media (max-width:560px){
  .header{ padding-left:16px; padding-right:16px; }
  .title-strip{ padding-left:16px; padding-right:16px; }
  .title-strip .kicker{ display:none; }           /* убираем, чтобы заголовок не жался */
  .stats, .cond, .list-head, .viewport{ margin-left:16px; margin-right:16px; }
  .bar-wrap{ display:none; }                        /* полоса-декор — прячем, даём место имени */
  .row{ padding:12px 14px; gap:10px; }
  .who .name{ font-size:1.05rem; }
}

/* ============ FOOTER ============ */
.footer{
  flex-shrink:0; background:var(--dark); color:#d8cdb8;
  padding:12px 0; overflow:hidden; white-space:nowrap;
  border-top:4px solid var(--orange);
}
.ticker{ display:inline-flex; gap:56px; animation:tick 26s linear infinite; }
.ticker span{ font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; font-weight:600; }
.ticker b{ color:var(--orange); }
@keyframes tick{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

/* ============ PRIZE DECK OVERLAY ============ */
.overlay{
  position:fixed; inset:0; z-index:40;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; opacity:0; visibility:hidden;
  transition:opacity .6s ease;
}
.overlay.on{ opacity:1; visibility:visible; }
.overlay-veil{
  position:absolute; inset:0;
  background:rgba(28,20,10,0);
  backdrop-filter:blur(0px);
  transition:background .6s ease, backdrop-filter .6s ease;
}
.overlay.on .overlay-veil{
  background:rgba(28,20,10,0.32);
  backdrop-filter:blur(7px);
}

.deck{ position:relative; width:min(74vw,760px); height:min(66vh,1080px); }

.prize{
  position:absolute; inset:0; margin:auto;
  width:100%; height:100%;
  background:var(--panel); border-radius:26px; overflow:hidden;
  box-shadow:var(--shadow-lg);
  border:1px solid rgba(255,255,255,.6);
  display:flex; flex-direction:column;
  opacity:0; transform:translateY(60px) scale(.9);
  transform-origin:center bottom;
}
.prize .media{
  flex:1; position:relative; overflow:hidden; background:#eee;
  display:flex; align-items:center; justify-content:center;
}
/* blurred copy of the same photo fills the empty bands (no crop, no stretch) */
.prize .media .bg{
  position:absolute; inset:0;
  background-size:cover; background-position:center;
  filter:blur(28px) brightness(.92) saturate(1.1);
  transform:scale(1.18);
}
/* the real photo, shown WHOLE — never cropped, never distorted */
.prize .media img{
  position:relative; z-index:1; display:block;
  max-width:100%; max-height:100%; width:auto; height:auto;
  object-fit:contain;
  box-shadow:0 10px 34px rgba(0,0,0,.28);
}
.prize .media .ph{
  position:relative; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; text-align:center; padding:24px;
  color:var(--muted);
}
.prize .media .ph .ph-t{ font-family:'Bebas Neue',sans-serif;
  font-size:2.4rem; letter-spacing:.04em; color:var(--ink); }
.prize .media .ph .ph-s{ font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; }
.prize .badge{
  position:absolute; top:18px; left:18px; z-index:2;
  background:var(--orange); color:#fff;
  font-family:'Bebas Neue',sans-serif; font-size:1.15rem; letter-spacing:.08em;
  padding:6px 16px; border-radius:100px;
  box-shadow:0 6px 18px rgba(217,96,10,.4);
}
.prize .cap{
  flex-shrink:0; padding:20px 26px 24px; text-align:center;
  background:linear-gradient(180deg,#fff,#fbf5ec);
  border-top:1px solid var(--line);
}
.prize .cap .k{ font-size:.62rem; letter-spacing:.22em; text-transform:uppercase;
  color:var(--muted); font-weight:700; }
.prize .cap .m{ font-family:'Bebas Neue',sans-serif; font-size:2.5rem;
  letter-spacing:.04em; color:var(--ink); line-height:1; margin-top:6px; }
.prize .cap .m span{ color:var(--orange-d); }

/* enter — одиночная карточка появляется по центру */
.prize.p1.enter{ animation:cardIn1 .8s cubic-bezier(.2,.8,.25,1) forwards, sway1 3.6s ease-in-out .8s infinite; }
@keyframes cardIn1{
  from{ opacity:0; transform:translateY(70px) scale(.88) rotate(0deg); }
  to  { opacity:1; transform:translateY(0) scale(1) rotate(-1.5deg); }
}
/* лёгкое покачивание */
@keyframes sway1{
  0%,100%{ transform:translateY(0) scale(1) rotate(-2.5deg); }
  50%    { transform:translateY(0) scale(1) rotate(1.5deg); }
}

/* exit — плавно убираем */
.prize.p1.exit{ animation:cardOut .8s ease forwards; }
@keyframes cardOut{ from{ opacity:1; } to{ opacity:0; transform:translateY(40px) scale(.9); } }

/* ============ LOADING ============ */
.loading{
  position:fixed; inset:0; z-index:100; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
}
.spinner{ width:44px; height:44px; border:3px solid rgba(239,125,26,.2);
  border-top-color:var(--orange); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.loading .lt{ font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:700; }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="lt">Загрузка…</div>
</div>

<div class="screen" id="screen" style="display:none">

  <!-- HEADER -->
  <div class="header">
    <div class="brand">
      <img id="logo" src="logo_promebel.png" alt="PROMEBEL" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex';">
      <div class="brand-fallback" id="logoFallback" style="display:none">
        <div class="brand-hex">P</div>
        <div class="brand-name">PRO<b>MEBEL</b></div>
      </div>
    </div>
    <div class="live"><span class="live-dot"></span>Прямой эфир</div>
  </div>

  <!-- TITLE (secondary) -->
  <div class="title-strip">
    <h1>СУПЕР <span>РОЗЫГРЫШ</span></h1>
    <div class="kicker">PROMEBEL · Шоурум</div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="n" id="statP">—</div>
      <div class="l">Участников</div>
    </div>
    <div class="stat accent">
      <div class="n" id="statC">—</div>
      <div class="l">Всего купонов</div>
    </div>
  </div>

  <!-- CONDITIONS typewriter -->
  <div class="cond">
    <div class="tag">Условия акции</div>
    <div class="type" id="typeLine"><span class="caret"></span></div>
  </div>

  <!-- LIST -->
  <div class="list-head">
    <div class="t">Таблица участников</div>
    <div class="rule"></div>
  </div>
  <div class="viewport" id="viewport">
    <div class="track" id="track"></div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="ticker" id="ticker"></div>
  </div>
</div>

<!-- PRIZE DECK OVERLAY -->
<div class="overlay" id="overlay">
  <div class="overlay-veil"></div>
  <div class="deck" id="deck">
    <div class="prize p1" data-i="1">
      <div class="media">
        <div class="bg" style="background-image:url('prize_labo.jpg')"></div>
        <img src="prize_labo.jpg" alt="Автомобиль LABO" onerror="this.style.display='none';this.previousElementSibling.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="ph" style="display:none"><div class="ph-t">LABO</div><div class="ph-s">prize_labo.jpg</div></div>
      </div>
      <div class="cap"><div class="k">Главный приз</div><div class="m">Автомобиль <span>LABO</span></div></div>
    </div>
  </div>
</div>

<script>
// ============ CONFIG ============
const API_URL   = "https://script.google.com/macros/s/AKfycbxr_b5aQBYW87H6L6rAEuZjYw4SoBE7bysbhplL-C_1hCD90CrzefxBTXY6QriK5DeZMQ/exec";
const THRESHOLD = 50000;   // сом для первого купона
const STEP      = 10000;   // сом за каждый следующий купон
const RELOAD_MS = 60000;   // перезагрузка данных
const SCROLL_MS = 2800;    // шаг автопрокрутки
const DECK_EVERY = 26000;  // как часто показывать призы

// ============ DEMO DATA (fallback, реальные контрагенты) ============
/*const DEMO = [
  ["Каюмов Рустам Истаравшан",167024.85],["Искандар Абдуллоев",132287.62],
  ["Чдмм Бунёд",130847.56],["Илёс Мебель (VIP)",129469.95],
  ["PROMEBEL Optom",126392.07],["PROMEBEL Nakd",103147.87],
  ["Усто падвалча",97150],["Солиев Лукмон Опт",90880.45],
  ["Олимов Ислом",88792.53],["Мухаммад Ако Истаравшан",87685],
  ["Каримчон Туркточ",79021.42],["Комфорт Чашма",71964.09],
  ["Исмоил Рахмонзода Истаравшан",71009.81],["Джураев Кахрамон (Ворух)",69940.87],
  ["Рустам ШБТ Истаравшан",65275.18],["Мухаммадчон Исмоилов",63505.93],
  ["Маъруфчон Оби Тоза",57717.9],["Усмонов Амир (VIP)",50045.47],
  ["Набиев Гайбулло (VIP)",48493.17],["Юсупов Олимчон",48026.15],
  ["Делюкс",47934.19],["Мирзо Якубов",45808.76],["Маъруф Истаравшан",45660.1],
  ["Насим",45151.22],["Акмалхон (VIP)",44570.45],["Каюмов Саидкамолиддин",42705.05],
  ["Фуркат Ситора",42151.06],["Амирчон Кедр",37913.85],["Хакимов Анвар",37095.85],
  ["Каримов Хусейнчон",35940.21],["Солиев Лукмон",35305.45],["Зиёев Абдухамид",35293.62]
];*/

// ============ COUPONS ============
function coupons(amount){
  if(amount < THRESHOLD) return 0;
  return 1 + Math.floor((amount - THRESHOLD) / STEP);
}
function fmt(n){ return Math.round(n).toLocaleString('ru-RU') + ' сом'; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ============ DATA ============
let people = [];
let totalCoupons = 0;

function normalize(list){
  return list
    .map(p => {
      const name = Array.isArray(p) ? p[0] : (p.name ?? p.contractor ?? '');
      const amt  = Number(Array.isArray(p) ? p[1] : (p.amount ?? p.sum ?? 0)) || 0;
      return { name, amount: amt, coupons: coupons(amt) };
    })
    .filter(p => p.coupons > 0)
    .sort((a,b) => b.amount - a.amount);
}

async function loadData(){
  let list = null;
  try{
    const res  = await fetch(API_URL, { cache:'no-store' });
    const json = await res.json();
    if(Array.isArray(json)) list = json;
    else if(json && Array.isArray(json.participants)) list = json.participants;
    else if(json && Array.isArray(json.rows)) list = json.rows;
  }catch(e){ /* offline / not deployed → demo */ }

  people = normalize((list && list.length) ? list : []);
  totalCoupons = people.reduce((s,p) => s + p.coupons, 0);
  render();
}

function render(){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('screen').style.display  = 'flex';

  animN('statP', people.length);
  animN('statC', totalCoupons);

  const track = document.getElementById('track');
  const maxC  = people[0]?.coupons || 1;
  track.innerHTML = people.map((p,i) => {
    const cls = i===0?'r1':i===1?'r2':i===2?'r3':'';
    const pct = Math.round((p.coupons / maxC) * 100);
    return `
    <div class="row ${cls}">
      <div class="rank">${i+1}</div>
      <div class="who">
        <div class="name">${esc(p.name)}</div>
      </div>
      <div class="bar-wrap"><div class="bar"><i data-pct="${pct}"></i></div></div>
      <div class="coupons"><div class="cn">${p.coupons}</div><div class="cl">купонов</div></div>
    </div>`;
  }).join('');

  requestAnimationFrame(() => {
    document.querySelectorAll('.bar > i').forEach(el => el.style.width = el.dataset.pct + '%');
  });

  scrollPos = 0; applyScroll(false);
}

function animN(id, target){
  const el = document.getElementById(id);
  let cur = 0; const step = Math.max(1, Math.round(target/28));
  const iv = setInterval(() => {
    cur = Math.min(cur + step, target);
    el.textContent = cur;
    if(cur >= target) clearInterval(iv);
  }, 38);
}

// ============ AUTO SCROLL ============
let scrollPos = 0, scrollDir = 1, scrollTimer = null;
function maxScroll(){
  const vp = document.getElementById('viewport');
  const tr = document.getElementById('track');
  return Math.max(0, tr.scrollHeight - vp.clientHeight + 20);
}
function applyScroll(anim=true){
  const tr = document.getElementById('track');
  tr.style.transition = anim ? 'transform .85s cubic-bezier(.4,0,.2,1)' : 'none';
  tr.style.transform  = `translateY(-${scrollPos}px)`;
}
function scrollStep(){
  const max = maxScroll(); if(max <= 0) return;
  if(scrollDir === 1){
    scrollPos = Math.min(scrollPos + 84, max);
    if(scrollPos >= max) scrollDir = -1;
  }else{
    scrollPos = Math.max(scrollPos - 84*3, 0);
    if(scrollPos <= 0) scrollDir = 1;
  }
  applyScroll(true);
}
function startScroll(){ clearInterval(scrollTimer); scrollTimer = setInterval(scrollStep, SCROLL_MS); }
function pauseScroll(){ clearInterval(scrollTimer); scrollTimer = null; }

// ============ CONDITIONS TYPEWRITER ============
const COND_LINES = [
  "Накопи <b>50 000 сом</b> покупок — получи <b>первый купон</b>.",
  "Каждые следующие <b>10 000 сом</b> — это <b>+1 купон</b>.",
  "Покупки суммируются в течение <b>нескольких месяцев</b>.",
  "Чем больше купонов — тем <b>выше шанс на победу</b>.",
  "Главный приз — <b>автомобиль LABO</b>."
];
let condIdx = 0;
function typeLine(){
  const el = document.getElementById('typeLine');
  const html = COND_LINES[condIdx];
  // strip tags for char-by-char, re-inject bolds at the end
  const plain = html.replace(/<[^>]+>/g,'');
  let i = 0;
  el.innerHTML = '<span class="caret"></span>';
  const iv = setInterval(() => {
    i++;
    if(i <= plain.length){
      el.innerHTML = esc(plain.slice(0,i)) + '<span class="caret"></span>';
    }else{
      clearInterval(iv);
      el.innerHTML = html + '<span class="caret"></span>';
      setTimeout(() => {
        condIdx = (condIdx + 1) % COND_LINES.length;
        typeLine();
      }, 3400);
    }
  }, 34);
}

// ============ FOOTER TICKER ============
function buildTicker(){
  const items = [
    "<b>PROMEBEL</b> · Супер розыгрыш",
    "Купи на <b>50 000 сом</b> — стань участником",
    "<b>+1 купон</b> за каждые <b>10 000 сом</b>",
    "Сумма копится <b>несколько месяцев</b>",
    "Главный приз: <b>автомобиль LABO</b>"
  ];
  const one = items.map(t => `<span>${t}</span>`).join('');
  document.getElementById('ticker').innerHTML = one + one;
}

// ============ PRIZE DECK CYCLE ============
const overlay = document.getElementById('overlay');
function qp(i){ return document.querySelector('.prize.p'+i); }

function showDeck(){
  pauseScroll();
  overlay.classList.add('on');
  const c = qp(1);
  c.classList.remove('enter','exit'); c.style.opacity='0';

  // карточка появляется по центру
  setTimeout(() => c.classList.add('enter'), 300);

  // держим, потом убираем
  const holdUntil = 300 + 800 + 3600; // вошла + пауза
  setTimeout(() => { c.classList.remove('enter'); c.classList.add('exit'); }, holdUntil);

  // прячем оверлей, возвращаем список
  setTimeout(() => {
    overlay.classList.remove('on');
    setTimeout(() => { c.classList.remove('exit'); c.style.opacity='0'; startScroll(); }, 650);
  }, holdUntil + 900);
}

// ============ INIT ============
buildTicker();
typeLine();
loadData().then(() => {
  startScroll();
  setTimeout(showDeck, 6000);          // первый показ призов
  setInterval(showDeck, DECK_EVERY);   // затем по кругу
});
setInterval(loadData, RELOAD_MS);
</script>
